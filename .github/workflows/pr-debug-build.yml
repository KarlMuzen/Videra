name: PR Debug APK

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Assemble Debug
        # Added lint/test bypass, build caching, and parallel execution
        run: gradle assembleDebug -x lint -x test --build-cache --parallel --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: videra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
