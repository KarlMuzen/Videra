name: PR Debug APK

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1. Build the debug APK (same as before, longer retention)
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Assemble Debug
        run: ./gradlew assembleDebug -x lint -x test

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: videra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # 2. Unit tests + lint + regression guard (runs in parallel with the build)
  checks:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard - CrashHandler must be installed
        run: |
          if ! grep -rq "CrashHandler.install" app/src/main/java; then
            echo "::error::CrashHandler.install(...) is never called. Crash traces will not be captured."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # 3. Launch the APK on emulators, 3 cold starts each, fail on any crash
  smoke-test:
    name: Launch smoke test (API ${{ matrix.api }})
    needs: assemble-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: videra-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write smoke script
        run: |
          cat > smoke.sh <<'EOF'
          set -u
          PKG=io.github.shashigm.videra
          fail=0

          adb install -r apk/*.apk || exit 1
          adb logcat -c

          for run in 1 2 3; do
            echo "=== cold launch $run ==="
            adb shell am force-stop "$PKG"
            adb shell am start -W -n "$PKG/$PKG.MainActivity"
            sleep 15
            if ! adb shell pidof "$PKG" > /dev/null; then
              echo "::error::$PKG is not running after launch $run"
              fail=1
            fi
          done

          adb logcat -b crash -d > smoke-crash.txt
          adb logcat -d > smoke-logcat.txt

          if grep -q "FATAL EXCEPTION" smoke-crash.txt; then
            echo "::error::Crash detected, see smoke-crash.txt"
            cat smoke-crash.txt
            fail=1
          fi

          exit $fail
          EOF

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash smoke.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-api${{ matrix.api }}
          path: |
            smoke-crash.txt
            smoke-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
